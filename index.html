<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ead8">
<title>К Зозяцке!</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#201b1a;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}

#wrap{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  position:relative;
  background:radial-gradient(circle at 50% 20%,#5d4a42,#211b1a 72%)
}

canvas{
  display:block;
  max-width:100vw;
  max-height:100vh;
  width:auto;
  height:auto;
  aspect-ratio:16/9;
  background:#f4e5ce;
  box-shadow:0 28px 80px #0009;
  touch-action:none
}

#loading{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:#1e1918;
  color:white;
  font-size:32px;
  font-weight:800;
  z-index:3
}

#touch{
  position:absolute;
  inset:0;
  display:none;
  pointer-events:none;
  padding:20px;
  align-items:end;
  justify-content:space-between
}

.pad,.forms{
  display:flex;
  gap:8px;
  pointer-events:auto
}

.forms{
  position:absolute;
  right:18px;
  top:18px
}

button{
  border:2px solid #fff9;
  background:#392d2acc;
  color:#fff;
  border-radius:18px;
  padding:14px 18px;
  font-weight:900;
  font-size:18px
}

.jump{
  pointer-events:auto
}

@media (pointer:coarse),(max-width:900px){
  #touch{display:flex}
}
</style>
</head>

<body>

<main id="wrap">

<canvas
  id="game"
  width="1600"
  height="900">
</canvas>

<div id="loading">
  Собираем альбом…
</div>

<div id="touch">

  <div class="pad">
    <button data-key="left">◀</button>
    <button data-key="right">▶</button>
  </div>

  <div class="forms">
    <button data-form="normal">🐾</button>
    <button data-form="ball">●</button>
    <button data-form="cape">⌁</button>
    <button data-form="jelly">≈</button>
  </div>

  <button
    class="jump"
    data-key="jump">
    ПРЫЖОК
  </button>

</div>

</main>
